<!DOCTYPE html>
<html lang="en-CA">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width" />
        <link rel="manifest" href="manifest.json" />
        <link rel="icon" href="icons/icon.svg" />
        <title>Driver Analytics</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <h1>Driver Analytics</h1>
        <form>
            <fieldset>
                <legend>Enter information about delivery</legend>
                <p>
                    <label for="start-datetime">Start Time</label>
                    <input type="datetime-local" id="start-datetime" required />
                </p>
                <p>
                    <label for="end-datetime">End Time</label>
                    <input type="datetime-local" id="end-datetime" required />
                </p>
            </fieldset>
            <p>
                <button type="submit">Add Delivery</button>
            </p>
        </form>
        <section id="past-deliveries"></section>
        <script src="app.js" defer></script>
        <script>
            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.register("sw.js");
            }
        </script>
    </body>
</html>
